<h1 class="text-center mb-4">Login Form</h1>

<form #regForm="ngForm" (ngSubmit)="userLoginClick(regForm)" class="col-11 col-md-8 col-lg-6 mx-auto">

  <!-- Поле для логина -->
  <div class="form-group">
    <label>Username</label>
    <input 
      type="text" 
      class="form-control" 
      [class.is-invalid]="submitted && loginRef.invalid"
      name="login" 
      [(ngModel)]="login" 
      #loginRef="ngModel"
      placeholder="Enter username" 
      required 
      minlength="3"
      maxlength="20">
    <div *ngIf="submitted && loginRef.invalid" class="invalid-feedback d-block">
      <small *ngIf="loginRef.errors?.['required']">Username is required</small>
      <small *ngIf="loginRef.errors?.['minlength']">Username must be at least 3 characters</small>
      <small *ngIf="loginRef.errors?.['maxlength']">Username cannot exceed 20 characters</small>
    </div>
  </div>

  <!-- Поле для пароля -->
  <div class="form-group">
    <label>Password</label>
    <input 
      type="password" 
      class="form-control" 
      [class.is-invalid]="submitted && passwordRef.invalid"
      name="password" 
      [(ngModel)]="password" 
      #passwordRef="ngModel"
      placeholder="Enter password" 
      required 
      minlength="6"
      maxlength="30">
    <div *ngIf="submitted && passwordRef.invalid" class="invalid-feedback d-block">
      <small *ngIf="passwordRef.errors?.['required']">Password is required</small>
      <small *ngIf="passwordRef.errors?.['minlength']">Password must be at least 6 characters</small>
      <small *ngIf="passwordRef.errors?.['maxlength']">Password cannot exceed 30 characters</small>
    </div>
  </div>

  <!-- Кнопка отправки -->
  <button type="submit" class="btn btn-success btn-block">Login</button>
</form>

<!-- Блок для сообщений -->
<div *ngIf="message" class="alert mt-4 text-center col-11 col-md-8 col-lg-6 mx-auto" [class.alert-success]="messageType === 'success'" [class.alert-danger]="messageType === 'danger'" role="alert">
  {{ message }}
</div>
